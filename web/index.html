<!doctype html>
<html lang="pt-BR">
<head>
<title>Rhalgr Meter</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Painel compacto que fica por cima do jogo. Tema único escuro; o fundo do painel tem opacidade ajustável. */
:root{
  color-scheme:dark;
  --alpha:.9;
  --panel:rgba(15,19,25,var(--alpha)); --panel-solid:#0F1319; --row:rgba(23,29,37,.92); --row-hi:#1E2630; --line:#273140;
  --fg:#E8ECF1; --muted:#8B96A5; --accent:#F08A3E;
  --tank:#5B8DEF; --heal:#4FBF7A; --dps:#E0605A;
  --good:#6CC28E; --warn:#E3A552; --bad:#E47A7A;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden}
html.page body{background:#0B0E12;padding:24px 16px;overflow:auto}
html.page .ov{height:min(560px,calc(100vh - 48px));margin:0 auto;max-width:420px}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.prow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}::-webkit-scrollbar-track{background:transparent}

/* Painel */
.ov{position:relative;height:100vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ov-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px 8px;border-bottom:1px solid var(--line);user-select:none}
html.host:not(.locked) .ov-top{cursor:move}
.ov-title{font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-time{font-size:1.02rem;text-align:right}
.ov-sub{display:flex;gap:7px;align-items:center;font-size:.8rem;color:var(--muted);min-width:0;white-space:nowrap}
.ov-total{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good);box-shadow:0 0 0 3px rgba(108,194,142,.18)}
.dot.demo,.dot.replay{background:var(--accent)}
.dot.err{background:var(--bad)}
.dot.wait{background:var(--warn)}
.lockmark{display:none;font-size:.75rem}
html.locked .lockmark{display:inline}
.bar{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:5px}
.bar select{flex:1;min-width:0;background:var(--row);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:.82rem;cursor:pointer}
.ib{background:var(--row);border:1px solid var(--line);border-radius:5px;width:28px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0}
.ib:hover{color:var(--fg);border-color:var(--muted)}
.ib[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.ib svg{width:15px;height:15px}
html.locked .bar{display:none}
.ov-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.ov-tabs button{background:none;border:none;padding:6px 0;font-weight:600;font-size:.84rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.ov-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.cols-head{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 46px 46px;gap:8px;padding:6px 16px 2px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cols-head span:nth-child(n+3){text-align:right;white-space:nowrap}
.pane{padding:4px 8px 8px;flex:1;min-height:60px;overflow-y:auto}

/* Linhas */
.prow{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 64px 46px 46px;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;overflow:hidden;margin-bottom:3px;background:var(--row);cursor:pointer;width:100%;border:none;text-align:left}
.prow:hover{background:var(--row-hi)}
.prow .fill{position:absolute;inset:0 auto 0 0;opacity:.22;transition:width .5s ease}
.prow>*:not(.fill){position:relative}
.job{font-family:var(--f-num);font-size:.68rem;font-weight:600;text-align:center;padding:1px 0;border-radius:3px;color:#0B0E12}
.pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pname .dead{color:var(--bad);font-size:.8rem}
.prow.me{box-shadow:inset 0 0 0 1px var(--accent)}
.prow.me .pname{font-weight:700}
.prow.sel{background:var(--row-hi);box-shadow:inset 0 0 0 1px var(--fg)}
.v1{font-size:.86rem;text-align:right}
.v2,.v3{font-size:.74rem;color:var(--muted);text-align:right}
.empty{color:var(--muted);font-size:.88rem;padding:14px 6px;text-align:center}

/* Detalhe */
.detail{border-top:1px solid var(--line);padding:9px 12px 10px;display:grid;gap:8px;max-height:52%;overflow-y:auto;flex:none}
.d-head{display:flex;gap:10px;align-items:center}
.d-head h3{margin:0;font-size:1rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:1px solid var(--line);border-radius:5px;padding:1px 8px;cursor:pointer;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.st{background:var(--row);border-radius:5px;padding:4px 7px;min-width:0}
.st b{display:block;font-family:var(--f-num);font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{font-size:.68rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl,.act{display:grid;grid-template-columns:minmax(0,1fr) 38px 64px 38px;gap:6px}
.lbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 6px}
.lbl span:nth-child(n+2),.act .num{text-align:right}
.acts{display:grid;gap:3px}
.act{align-items:center;font-size:.82rem;position:relative;padding:2px 6px;border-radius:4px;overflow:hidden}
.act i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.16}
.act span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .c{color:var(--muted)}

/* Reprodução e mensagens */
.rp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel-solid);font-size:.8rem}
.btn{background:var(--row);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0B0E12}
.rp .prog{margin-left:auto;color:var(--muted)}
html.locked .rp{display:none}
.msg{font-size:.8rem;color:var(--warn);padding:6px 12px;border-top:1px solid var(--line)}

/* Menu */
.menu{position:absolute;right:8px;top:86px;z-index:5;width:min(270px,calc(100% - 16px));background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px;display:grid;gap:2px}
.menu button.mi{background:none;border:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:.88rem}
.menu button.mi:hover{background:var(--row-hi)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.menu label{font-size:.74rem;color:var(--muted);padding:2px 8px 0}
.menu .row{display:flex;gap:6px;padding:2px 8px 4px;align-items:center}
.menu input[type=text]{flex:1;min-width:0;background:#070A0D;border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-family:var(--f-num);font-size:.72rem}
.menu input[type=range]{flex:1;accent-color:var(--accent)}
.menu .hint{font-size:.74rem;color:var(--muted);padding:2px 8px 4px}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:4;
  background:linear-gradient(135deg,transparent 0 55%,var(--muted) 55% 62%,transparent 62% 72%,var(--muted) 72% 79%,transparent 79%);opacity:.6}
html:not(.host) .grip,html.locked .grip{display:none}
html:not(.host) .host-only{display:none}
@media (max-width:340px){.cols-head,.prow{grid-template-columns:30px minmax(0,1fr) 60px 44px}.cols-head span:last-child,.prow .v3{display:none}}
@media (prefers-reduced-motion:reduce){.prow .fill{transition:none}}
</style>
</head>
<body>
<div class="ov" id="ov">
  <div class="ov-top" id="top">
    <div class="ov-title" id="encTitle">Aguardando combate</div>
    <div class="ov-time num" id="encTime">00:00</div>
    <div class="ov-sub"><span class="dot" id="dot"></span><span id="modeLbl">Desconectado</span><span class="lockmark" title="Travado: Ctrl+Shift+L destrava">🔒</span></div>
    <div class="ov-total"><span class="num" id="total">0</span> <span id="totalLbl">DPS da party</span></div>
    <div class="bar">
      <select id="histSel" aria-label="Luta"></select>
      <button class="ib host-only" id="bLock" type="button" title="Travar (Ctrl+Shift+L): o mouse passa para o jogo" aria-label="Travar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></button>
      <button class="ib" id="bMenu" type="button" title="Menu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
    </div>
  </div>
  <div class="menu" id="menu" hidden>
    <button class="mi" id="mLive" type="button">Conectar ao IINACT</button>
    <button class="mi" id="mDemo" type="button">Demonstração</button>
    <button class="mi" id="mReplay" type="button">Reproduzir log…</button>
    <hr>
    <button class="mi" id="mDpsMode" type="button"></button>
    <div class="hint" id="mDpsHint"></div>
    <label for="mAlpha">Opacidade do fundo</label>
    <div class="row"><input type="range" id="mAlpha" min="20" max="100" step="5"><span class="num" id="mAlphaV" style="font-size:.74rem;width:34px;text-align:right"></span></div>
    <label for="mUrl">Endereço do IINACT</label>
    <div class="row"><input type="text" id="mUrl" spellcheck="false"><button class="btn" id="mUrlOk" type="button">OK</button></div>
    <button class="mi" id="mClear" type="button">Limpar histórico</button>
    <hr class="host-only">
    <div class="hint host-only">Ctrl+Shift+L trava/destrava · Ctrl+Shift+H mostra/oculta</div>
    <button class="mi host-only" id="mHide" type="button">Ocultar na bandeja</button>
    <button class="mi host-only" id="mQuit" type="button">Sair</button>
  </div>
  <div class="ov-tabs" role="tablist">
    <button role="tab" id="tab-dps" aria-selected="true">DPS</button>
    <button role="tab" id="tab-heal" aria-selected="false">Cura</button>
    <button role="tab" id="tab-tank" aria-selected="false">Tanque</button>
  </div>
  <div class="cols-head" id="colsHead"></div>
  <div class="pane" id="rows"></div>
  <div class="detail" id="detail" hidden></div>
  <div class="msg" id="msg" hidden></div>
  <div class="rp" id="rp" hidden>
    <button class="btn" id="rPlay" type="button">❚❚</button>
    <button class="btn" type="button" data-sp="1">1×</button><button class="btn" type="button" data-sp="4">4×</button><button class="btn" type="button" data-sp="16">16×</button><button class="btn" type="button" data-sp="64">64×</button>
    <button class="btn" id="rEnd" type="button" title="Processar o resto do log de uma vez">⏭</button>
    <button class="btn" id="rStop" type="button" title="Parar e voltar ao IINACT">✕</button>
    <span class="prog num" id="rProg"></span>
  </div>
  <div class="grip" id="grip" title="Redimensionar"></div>
</div>
<input type="file" id="fileIn" accept=".log,.txt" hidden>

<script src="engine.js"></script>
<script>
(function(){
"use strict";
/* ================= Ambiente ================= */
const HOST=window.chrome&&window.chrome.webview?window.chrome.webview:null;   // dentro do app Rhalgr Meter
const params=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const DEFAULT_WS="ws://127.0.0.1:10501/ws";
let WS_URL=params.get("OVERLAY_WS")||store.get("rm-ws",DEFAULT_WS);
const BROWSER_LIVE=!HOST&&(params.has("OVERLAY_WS")||(location.protocol==="file:"&&!params.has("demo")));
const docEl=document.documentElement;
if(HOST) docEl.classList.add("host"); else if(!BROWSER_LIVE) docEl.classList.add("page");
const post=m=>{if(HOST)HOST.postMessage(m)};
const ROLE={PLD:"tank",WAR:"tank",DRK:"tank",GNB:"tank",GLA:"tank",MRD:"tank",WHM:"heal",SCH:"heal",AST:"heal",SGE:"heal",CNJ:"heal"};

/* ================= Estado ================= */
const S={me:"",mode:"idle",link:"idle",tab:store.get("rm-tab2","dps"),sel:null,view:"live",cur:null,savedKey:"",history:[],
  dpsMode:store.get("rm-dpsmode","enc")};   // "enc": dano ÷ duração da luta (padrão ACT) · "active": dano ÷ tempo ativo do jogador
// lutas antigas do histórico não têm dpsAct
const dpsOf=c=>S.dpsMode==="active"&&c.dpsAct?c.dpsAct:c.dps;
try{S.history=JSON.parse(store.get("rm-hist3","[]"))||[]}catch(e){S.history=[]}
const LE=RhalgrEngine.create({onEnd:snap=>{if(S.mode==="demo"||S.mode==="replay"){S.cur=snap;saveHistory(snap)}}});

/* ================= Dados do IINACT/ACT (OverlayPlugin) ================= */
function handle(msg){
  if(!msg) return;
  if(msg.msgtype&&msg.msg){try{msg=typeof msg.msg==="string"?JSON.parse(msg.msg):msg.msg}catch(e){return}}
  if(S.mode!=="live") return;
  switch(msg.type){
    case "CombatData": onCombat(msg);break;
    case "LogLine":{const L=msg.line||String(msg.rawLine||"").split("|");LE.feed(L);if(L[0]==="02"&&L[3])S.me=L[3];break}
    case "ChangePrimaryPlayer": if(msg.charName) S.me=msg.charName;break;
  }
  dirty();
}
// O IINACT formata pela região do Windows: "896,33" no Brasil, "896.33" em inglês. Com os dois sinais, o último é o decimal.
function num(v){
  if(v==null)return 0;
  let s=String(v).replace(/[^\d.,-]/g,"");
  const dot=s.lastIndexOf("."), comma=s.lastIndexOf(",");
  if(comma>dot)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");
  const n=parseFloat(s);return isFinite(n)?n:0;
}
function splitMax(s){if(!s)return null;s=String(s);const i=s.lastIndexOf("-");if(i<0)return null;const v=num(s.slice(i+1));return v?{n:s.slice(0,i),v}:null}
function onCombat(d){
  const e=d.Encounter||{}, dur=num(e.DURATION), active=String(d.isActive)==="true";
  const list=Object.values(d.Combatant||{}).map(c=>{
    const name=(c.name==="YOU"&&S.me)?S.me:c.name;
    return {name,job:String(c.Job||"").toUpperCase(),
      dps:num(c.encdps),dpsAct:num(c.dps),dmg:num(c.damage),dmgPct:c["damage%"]||"0%",crit:c["crithit%"]||"0%",dh:c.DirectHitPct||"0%",maxhit:splitMax(c.maxhit),
      hps:num(c.enchps),heal:num(c.healed),healPct:c["healed%"]||"0%",over:c.OverHealPct||"0%",maxheal:splitMax(c.maxheal),
      taken:num(c.damagetaken),deaths:num(c.deaths),me:name===S.me||c.name==="YOU"};
  }).filter(c=>c.dps>0||c.hps>0||c.taken>0||c.me);
  S.cur={title:e.title&&e.title!=="Encounter"?e.title:(e.CurrentZoneName||"Combate"),zone:e.CurrentZoneName||"",time:e.duration||"00:00",dur:Math.max(1,dur),
    dps:num(e.encdps),hps:num(e.enchps),active,when:Date.now(),combatants:list,actions:LE.recentActions()||{}};
  if(!active&&dur>=5) saveHistory(S.cur);
}
function saveHistory(c){
  if(!c||c.dur<5) return;
  const key=c.title+"|"+c.time+"|"+Math.round(c.dps);
  if(S.savedKey===key) return; S.savedKey=key;
  S.history.unshift(JSON.parse(JSON.stringify(c)));
  S.history.length=Math.min(S.history.length,20);
  store.set("rm-hist3",JSON.stringify(S.history));
  fillHist();
}

/* ================= Render ================= */
const fmt=n=>Math.round(n).toLocaleString("pt-BR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS={
  dps:{get head(){return ["","Jogador",S.dpsMode==="active"?"DPS ativo":"DPS","%","Crít"]},val:c=>dpsOf(c),cells:c=>[fmt(dpsOf(c)),c.dmgPct,c.crit],total:e=>[e.dps,"DPS da party"]},
  heal:{head:["","Jogador","HPS","%","Over"],val:c=>c.hps,cells:c=>[fmt(c.hps),c.healPct,c.over],total:e=>[e.hps,"HPS da party"]},
  tank:{head:["","Jogador","DTPS","%","Mortes"],val:c=>c.taken,cells:(c,e,tot)=>[fmt(c.taken/e.dur),Math.round(c.taken/tot*100)+"%",String(c.deaths)],total:e=>[e.combatants.reduce((a,c)=>a+c.taken,0)/e.dur,"dano recebido/s"]}
};
const MODE_LBL={live:"Ao vivo",wait:"Conectando…",err:"Sem conexão",idle:"Desconectado",demo:"Demonstração",replay:"Reproduzindo log"};
let pending=false;
function dirty(){if(!pending){pending=true;requestAnimationFrame(render)}}
function viewEnc(){return S.view==="live"?S.cur:S.history[+S.view]}
function render(){
  pending=false;
  const e=viewEnc(), T=TABS[S.tab];
  $("colsHead").innerHTML=T.head.map(h=>`<span>${h}</span>`).join("");
  $("encTitle").textContent=e?e.title:"Aguardando combate";
  $("encTitle").title=e&&e.zone?e.zone:"";
  $("encTime").textContent=e?e.time:"00:00";
  if(e){const [v,l]=T.total(e);$("total").textContent=fmt(v);$("totalLbl").textContent=l}
  else{$("total").textContent="0";$("totalLbl").textContent=T.total({dps:0,hps:0,dur:1,combatants:[]})[1]}
  const rows=e?e.combatants.filter(c=>T.val(c)>0||(S.tab==="tank"&&c.deaths)).sort((a,b)=>T.val(b)-T.val(a)):[];
  if(rows.length){
    const top=T.val(rows[0])||1, tot=rows.reduce((a,c)=>a+T.val(c),0)||1;
    setHTML($("rows"),rows.map(c=>{const role=ROLE[c.job]||(c.job?"dps":"none");const col=role==="none"?"var(--muted)":`var(--${role})`;const cells=T.cells(c,e,tot);
      return `<button type="button" class="prow${c.me?" me":""}${S.sel===c.name?" sel":""}" data-n="${esc(c.name)}"><span class="fill" style="width:${(T.val(c)/top*100).toFixed(1)}%;background:${col}"></span>
      <span class="job" style="background:${col}">${esc(c.job||"LB")}</span><span class="pname">${esc(c.me?"Você":c.name)}${c.deaths?` <span class="dead">✝${c.deaths}</span>`:""}</span>
      <span class="v1 num">${cells[0]}</span><span class="v2 num">${esc(cells[1])}</span><span class="v3 num">${esc(cells[2])}</span></button>`}).join(""));
  } else {
    const hint=S.mode==="live"?"Entre em combate para ver os números.":S.mode==="err"||S.mode==="wait"?"Esperando o IINACT. Abra o menu ⋯ para ver a demonstração ou reproduzir um log.":"Sem dados ainda.";
    setHTML($("rows"),`<div class="empty">${e?"Ninguém nesta categoria ainda.":hint}</div>`);
  }
  renderDetail(e);
  $("dot").className="dot "+S.mode;
  $("modeLbl").textContent=(S.view!=="live"?"Histórico · ":"")+(MODE_LBL[S.mode]||"");
  $("mLive").textContent=S.mode==="live"||S.mode==="wait"||S.mode==="err"?"Reconectar ao IINACT":"Voltar ao IINACT (ao vivo)";
}
function renderDetail(e){
  const box=$("detail"); const c=e&&S.sel?e.combatants.find(x=>x.name===S.sel):null;
  if(!c){box.hidden=true;return}
  box.hidden=false;
  const heal=S.tab==="heal";
  const mh=c.maxhit, mc=c.maxheal;
  const raw=(e.actions||{})[c.name]||{};
  let acts=Object.entries(raw).map(([a,x])=>typeof x==="number"?{a,n:x,v:0}:{a,n:x.n||0,v:(heal?x.heal:x.dmg)||0});
  const tot=acts.reduce((s,x)=>s+x.v,0);
  acts=acts.filter(x=>x.v>0||(!tot&&x.n>0)).sort((a,b)=>b.v-a.v||b.n-a.n).slice(0,12);
  const topV=acts.length?(tot?acts[0].v:acts[0].n):1;
  setHTML(box,`<div class="d-head"><h3>${esc(c.me?"Você":c.name)} <span class="muted" style="font-weight:500">· ${esc(c.job||"—")}</span></h3><button type="button" class="x" id="dClose" aria-label="Fechar detalhes">✕</button></div>
   <div class="stats">
    <div class="st" title="Dano ÷ duração da luta (padrão do ACT)"><b>${fmt(c.dps)}</b><span>DPS na luta</span></div><div class="st" title="Dano ÷ tempo entre o primeiro e o último golpe deste jogador"><b>${c.dpsAct?fmt(c.dpsAct):"—"}</b><span>DPS ativo</span></div><div class="st"><b>${fmt(c.dmg)}</b><span>Dano total</span></div>
    <div class="st"><b>${esc(c.crit)}</b><span>Crítico</span></div><div class="st"><b>${esc(c.dh)}</b><span>Direct hit</span></div><div class="st"><b>${esc(c.dmgPct)}</b><span>% do dano</span></div>
    <div class="st"><b>${fmt(c.hps)}</b><span>HPS</span></div><div class="st"><b>${esc(c.over)}</b><span>Overheal</span></div><div class="st"><b>${fmt(c.taken/e.dur)}</b><span>Dano recebido/s</span></div>
   </div>
   <div class="stats" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="st"><b>${mh?fmt(mh.v):"—"}</b><span>Maior golpe${mh?": "+esc(mh.n):""}</span></div><div class="st"><b>${mc?fmt(mc.v):"—"}</b><span>Maior cura${mc?": "+esc(mc.n):""}</span></div>
   </div>
   <div class="lbl"><span>${heal?"Cura por habilidade":"Dano por habilidade"}</span><span>Usos</span><span>${heal?"Cura":"Dano"}</span><span>%</span></div>
   <div class="acts">${acts.length?acts.map(x=>{const w=(tot?x.v:x.n)/topV*100;
     return `<div class="act"><i style="width:${w.toFixed(1)}%"></i><span>${esc(x.a)}</span><span class="num c">${x.n||"—"}</span><span class="num">${tot?fmt(x.v):"—"}</span><span class="num c">${tot?Math.round(x.v/tot*100)+"%":"—"}</span></div>`}).join("")
     :`<span class="muted" style="font-size:.84rem">Nenhuma habilidade registrada.</span>`}</div>`);
}
$("detail").addEventListener("pointerdown",ev=>{if(ev.target.closest("#dClose")){S.sel=null;dirty()}});
// pointerdown: durante a reprodução as linhas são redesenhadas a cada quadro e um "click" se perderia
$("rows").addEventListener("pointerdown",ev=>{if(ev.button!==0)return;const b=ev.target.closest(".prow");if(!b)return;const n=b.dataset.n;S.sel=S.sel===n?null:n;dirty()});
$("rows").addEventListener("keydown",ev=>{if(ev.key!=="Enter"&&ev.key!==" ")return;const b=ev.target.closest(".prow");if(!b)return;ev.preventDefault();const n=b.dataset.n;S.sel=S.sel===n?null:n;dirty()});
function setHTML(el,html){if(el._html!==html){el._html=html;el.innerHTML=html}}

/* ================= Abas e histórico ================= */
function showTab(t){S.tab=t;["dps","heal","tank"].forEach(x=>$("tab-"+x).setAttribute("aria-selected",String(x===t)));store.set("rm-tab2",t);dirty()}
["dps","heal","tank"].forEach(x=>$("tab-"+x).onclick=()=>showTab(x));
function fillHist(){
  const sel=$("histSel"), v=S.view;
  sel.innerHTML=`<option value="live">Luta atual</option>`+S.history.map((h,i)=>{const d=new Date(h.when);
    return `<option value="${i}">${esc(h.title)} · ${esc(h.time)} · ${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</option>`}).join("");
  sel.value=(v==="live"||+v<S.history.length)?v:"live";
}
$("histSel").onchange=e=>{S.view=e.target.value;S.sel=null;dirty()};

/* ================= Mensagens ================= */
function showMsg(t){const m=$("msg");m.hidden=!t;m.textContent=t||""}
function linkMsg(){
  if(S.mode!=="err") {showMsg("");return}
  showMsg(`Não conectou em ${WS_URL}. Confira se o IINACT está rodando (no jogo: /iinact) com o servidor WebSocket ligado. Tentando de novo a cada 3s.`);
}

/* ================= Conexão ao vivo ================= */
let ws=null,retry=null;
function setLink(st){S.link=st;if(["live","wait","err","idle"].includes(S.mode)){S.mode=st;linkMsg();dirty()}}
function connectLive(){
  stopReplay(); LE.reset(); S.cur=null; S.view="live"; fillHist();
  S.mode="wait"; showMsg(""); dirty(); $("rp").hidden=true;
  if(HOST){post({cmd:"connect",url:WS_URL});return}
  disconnectBrowser();
  try{ws=new WebSocket(WS_URL)}catch(e){setLink("err");return}
  let opened=false;
  ws.onopen=()=>{opened=true;setLink("live");ws.send(JSON.stringify({call:"subscribe",events:["CombatData","LogLine","ChangePrimaryPlayer"]}))};
  ws.onmessage=ev=>{try{handle(JSON.parse(ev.data))}catch(e){}};
  ws.onclose=()=>{setLink("err");retry=setTimeout(connectLive,3000)};
}
function disconnectBrowser(){if(retry){clearTimeout(retry);retry=null}if(ws){ws.onclose=null;try{ws.close()}catch(e){}ws=null}}
function disconnect(){if(HOST)post({cmd:"disconnect"});else disconnectBrowser()}

/* ================= Reprodução (log real ou demonstração) ================= */
const RP={lines:null,i:0,t0:0,sim:0,speed:+store.get("rm-speed","16"),running:false,last:0,name:""};
function parseLog(text){
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const k=line.slice(0,line.indexOf("|"));
    if(!RhalgrEngine.KEEP.has(k)) continue;
    const L=line.split("|"), t=RhalgrEngine.parseTime(L[1]);
    if(isFinite(t)) out.push([t,L]);
  }
  return out;
}
function startReplay(lines,name,mode){
  if(!lines.length){showMsg("Esse arquivo não parece um log do IINACT/ACT.");return}
  disconnect(); LE.reset();
  Object.assign(RP,{lines,i:0,t0:lines[0][0],sim:0,name,running:true,last:performance.now()});
  S.mode=mode; S.cur=null; S.sel=null; S.view="live"; S.savedKey=""; fillHist(); showMsg(""); $("rp").hidden=false;
  setSpeed(RP.speed); updateBar(); dirty(); requestAnimationFrame(stepReplay);
}
function feedNext(){const x=RP.lines[RP.i++];LE.feed(x[1],x[0])}
function stepReplay(now){
  if(!RP.running) return;
  const dt=Math.min(250,now-RP.last); RP.last=now;
  const L=RP.lines;
  // fora de combate não há nada para ver: processa direto até a próxima luta
  while(!LE.active&&RP.i<L.length){feedNext(); RP.sim=L[RP.i-1][0]-RP.t0}
  RP.sim+=dt*RP.speed;
  const clock=RP.t0+RP.sim;
  while(RP.i<L.length&&L[RP.i][0]<=clock) feedNext();
  if(LE.active) S.cur=LE.snapshot();
  if(RP.i>=L.length){LE.end();RP.running=false}
  updateBar(); dirty();
  if(RP.running) requestAnimationFrame(stepReplay);
}
function stopReplay(){RP.running=false;RP.lines=null}
function updateBar(){
  const L=RP.lines; if(!L) return;
  $("rPlay").textContent=RP.running?"❚❚":"▶";
  const done=RP.i>=L.length;
  const t=L[Math.min(RP.i,L.length-1)][0];
  $("rProg").textContent=done?"fim do log":new Date(t).toLocaleTimeString("pt-BR")+" · "+Math.round(RP.i/L.length*100)+"%";
}
function setSpeed(v){RP.speed=v;store.set("rm-speed",String(v));document.querySelectorAll("[data-sp]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.sp===v)))}
document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>setSpeed(+b.dataset.sp));
$("rPlay").onclick=()=>{
  if(!RP.lines) return;
  if(RP.running){RP.running=false;updateBar();return}
  if(RP.i>=RP.lines.length){startReplay(RP.lines,RP.name,S.mode);return}
  RP.running=true;RP.last=performance.now();updateBar();requestAnimationFrame(stepReplay);
};
$("rEnd").onclick=()=>{if(!RP.lines)return;while(RP.i<RP.lines.length)feedNext();LE.end();RP.running=false;updateBar();dirty()};
$("rStop").onclick=()=>connectLive();
function openLog(){if(HOST)post({cmd:"openLog"});else $("fileIn").click()}
$("fileIn").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>startReplay(parseLog(String(r.result)),f.name,"replay");r.readAsText(f);ev.target.value=""};

/* Demonstração: gera um log sintético de 5 minutos e reproduz pelo mesmo motor. */
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const ME="Kaze Ashveil";
const PARTY=[
 {name:"Aster Vael",job:"PLD",dps:15800,hps:900,tk:5200,crit:.22,dh:.30,gcd:["Fast Blade","Riot Blade","Royal Authority","Holy Spirit","Confiteor","Blade of Honor"],og:["Circle of Scorn","Expiacion","Intervene"],hn:["Clemency"]},
 {name:"Brann Oskar",job:"DRK",dps:16400,hps:0,tk:4300,crit:.23,dh:.31,gcd:["Hard Slash","Syphon Strike","Souleater","Bloodspiller","Scarlet Delirium","Disesteem"],og:["Edge of Shadow","Shadowbringer","Salted Earth"],hn:[]},
 {name:"Lia Moraes",job:"WHM",dps:9800,hps:7600,tk:700,crit:.24,dh:.28,gcd:["Glare III","Glare IV","Dia","Afflatus Misery"],og:["Assize"],hn:["Afflatus Rapture","Cure II","Medica III"]},
 {name:"Sora Tenma",job:"SGE",dps:9300,hps:6900,tk:700,crit:.25,dh:.29,gcd:["Dosis III","Eukrasian Dosis III","Phlegma III","Pneuma"],og:["Psyche"],hn:["Kerachole","Ixochole","Druochole"]},
 {name:ME,job:"MNK",dps:27200,hps:0,tk:850,crit:.31,dh:.42,gcd:["Leaping Opo","Dragon Kick","Rising Raptor","Twin Snakes","Pouncing Coeurl","Demolish","Phantom Rush","Fire's Reply"],og:["The Forbidden Chakra","Six-sided Star"],hn:[]},
 {name:"Ryn Halvard",job:"DRG",dps:26300,hps:0,tk:850,crit:.28,dh:.40,gcd:["Raiden Thrust","Lance Barrage","Spiral Blow","Chaotic Spring","Heavens' Thrust","Drakesbane"],og:["Geirskogul","Nastrond","Stardiver","Starcross"],hn:[]},
 {name:"Mirela Fox",job:"BRD",dps:22800,hps:0,tk:750,crit:.27,dh:.39,gcd:["Burst Shot","Refulgent Arrow","Apex Arrow","Iron Jaws","Resonant Arrow","Radiant Encore"],og:["Heartbreak Shot","Empyreal Arrow","Pitch Perfect","Sidewinder"],hn:[]},
 {name:"Ottilie Brume",job:"PCT",dps:28600,hps:0,tk:700,crit:.26,dh:.38,gcd:["Fire in Red","Aero in Green","Water in Blue","Holy in White","Comet in Black","Hammer Stamp","Star Prism","Rainbow Drip"],og:["Mog of the Ages","Subtractive Palette"],hn:[]}
];
function demoLog(){
  const R=rng(1+Math.floor(Math.random()*1e6)), t0=Date.now(), out=[], DUR=300;
  const iso=ms=>new Date(t0+ms).toISOString();
  const BOSS="40001A2B", BOSSN="Boneco de Treino", MAXHP=120000;
  const push=(ms,L)=>out.push([t0+ms,L]);
  const ids=PARTY.map((p,i)=>(0x10A00010+i).toString(16).toUpperCase());
  const line=(ms,type,src,srcN,ab,tgt,tgtN,flag,amt,idx,cur,max)=>{const L=new Array(47).fill("0");
    Object.assign(L,{0:type,1:iso(ms),2:src,3:srcN,4:"1",5:ab,6:tgt,7:tgtN,8:flag.toString(16).toUpperCase(),9:RhalgrEngine.encodeAmount(amt),24:String(cur),25:String(max),45:String(idx)});push(ms,L)};
  push(0,["01",iso(0),"0","Arena de Treino"]);
  PARTY.forEach((p,i)=>push(0,["03",iso(0),ids[i],p.name,RhalgrEngine.JOBS.indexOf(p.job).toString(16).toUpperCase(),"64","0000","0","","0","0",String(MAXHP),String(MAXHP)]));
  push(0,["02",iso(0),ids[4],ME]);
  push(0,["03",iso(0),BOSS,BOSSN,"0","64","0000","0","","0","0","99999999","99999999"]);
  const deathAt={"Mirela Fox":191};
  PARTY.forEach((p,i)=>{
    const gcdLen=p.job==="MNK"?1940:2450, ph=R()*6;
    let bank=0,t=200+R()*1500;
    for(let s=0;s*1000<DUR*1000;s++){
      const dead=deathAt[p.name]&&s>=deathAt[p.name]&&s<deathAt[p.name]+22;
      if(dead) continue;
      const raid=s>6&&(s%120)>6&&(s%120)<26;
      bank+=p.dps*(1+.18*Math.sin(s/9+ph))*(raid?1.22:1)*(.8+R()*.4);
      while(t<(s+1)*1000){
        const crit=R()<p.crit, dh=R()<p.dh, mult=(crit?1.5:1)*(dh?1.25:1);
        const og=p.og.length&&R()<.35;
        const amt=bank*(og?.4:.6)/((crit?1.5:1)*(dh?1.25:1))*mult;
        bank-=bank*(og?.4:.6);
        line(t,"21",ids[i],p.name,og?p.og[Math.floor(R()*p.og.length)]:p.gcd[Math.floor(R()*p.gcd.length)],BOSS,BOSSN,3|(crit?0x2000:0)|(dh?0x4000:0),amt,0,9e7,99999999);
        if(p.hps&&p.hn.length){
          const ab=p.hn[Math.floor(R()*p.hn.length)], targets=s%38===1?8:1;
          for(let k=0;k<targets;k++){const j=targets>1?k:Math.floor(R()*8);
            line(t,"22",ids[i],p.name,ab,ids[j],PARTY[j].name,4|(R()<p.crit?0x200000:0),p.hps*gcdLen/1000/targets*(targets>1?3.2:1)*(.7+R()*.6),k,Math.round(MAXHP*(.45+R()*.6)),MAXHP)}
        }
        t+=gcdLen*(og?.5:1);
      }
    }
  });
  for(let s=1;s<DUR;s++){
    if(s%3===0){const j=s%2?0:1;line(s*1000+300,"21",BOSS,BOSSN,"attack",ids[j],PARTY[j].name,3,PARTY[j].tk*3*(.7+R()*.6),0,MAXHP,MAXHP)}
    if(s%38===0) PARTY.forEach((p,j)=>{if(!(deathAt[p.name]&&s>=deathAt[p.name]&&s<deathAt[p.name]+22))line(s*1000+500,"22",BOSS,BOSSN,"Golpe Sísmico",ids[j],p.name,3,11000+R()*3000,j,MAXHP,MAXHP)});
  }
  Object.entries(deathAt).forEach(([n,s])=>{const j=PARTY.findIndex(p=>p.name===n);push(s*1000,["25",iso(s*1000),ids[j],n,BOSS,BOSSN])});
  push(DUR*1000,["260",iso(DUR*1000),"0","0","1","1"]);
  return out.sort((a,b)=>a[0]-b[0]);
}

/* ================= Menu, travar, arrastar ================= */
const menu=$("menu");
function toggleMenu(open){menu.hidden=!open;$("bMenu").setAttribute("aria-expanded",String(open))}
$("bMenu").onclick=ev=>{ev.stopPropagation();toggleMenu(menu.hidden)};
document.addEventListener("click",ev=>{if(!menu.hidden&&!menu.contains(ev.target))toggleMenu(false)});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")toggleMenu(false)});
$("mLive").onclick=()=>{toggleMenu(false);connectLive()};
$("mDemo").onclick=()=>{toggleMenu(false);startReplay(demoLog(),"Demonstração","demo")};
$("mReplay").onclick=()=>{toggleMenu(false);openLog()};
function setDpsMode(m){
  S.dpsMode=m; store.set("rm-dpsmode",m);
  $("mDpsMode").textContent=m==="active"?"DPS: tempo ativo de cada jogador":"DPS: duração da luta (padrão ACT)";
  $("mDpsHint").textContent=m==="active"
    ?"Melhor no boneco e no mundo aberto, onde estranhos mantêm a luta aberta. Clique para voltar ao padrão do ACT."
    :"Igual ao ACT e ao FFLogs, o justo em raide. No boneco com outras pessoas batendo, use o tempo ativo.";
  dirty();
}
$("mDpsMode").onclick=()=>setDpsMode(S.dpsMode==="active"?"enc":"active");
setDpsMode(S.dpsMode);
$("mClear").onclick=()=>{S.history=[];S.view="live";store.set("rm-hist3","[]");fillHist();toggleMenu(false);dirty()};
$("mHide").onclick=()=>{toggleMenu(false);post({cmd:"hide"})};
$("mQuit").onclick=()=>post({cmd:"quit"});
function setAlpha(v){v=Math.max(20,Math.min(100,v));docEl.style.setProperty("--alpha",String(v/100));$("mAlpha").value=v;$("mAlphaV").textContent=v+"%";store.set("rm-alpha",String(v))}
$("mAlpha").oninput=e=>setAlpha(+e.target.value);
setAlpha(+store.get("rm-alpha","90"));
$("mUrl").value=WS_URL;
$("mUrlOk").onclick=()=>{const v=$("mUrl").value.trim()||DEFAULT_WS;WS_URL=v;store.set("rm-ws",v);toggleMenu(false);connectLive()};
$("mUrl").onkeydown=e=>{if(e.key==="Enter")$("mUrlOk").click()};

function setLocked(v){docEl.classList.toggle("locked",v);$("bLock").setAttribute("aria-pressed",String(v));if(v)toggleMenu(false)}
$("bLock").onclick=()=>post({cmd:"lock",value:true});
$("top").addEventListener("mousedown",ev=>{if(ev.button!==0||ev.target.closest("select,button,input"))return;ev.preventDefault();post({cmd:"drag"})});
$("grip").addEventListener("mousedown",ev=>{if(ev.button!==0)return;ev.preventDefault();post({cmd:"resize"})});

/* ================= Mensagens do app ================= */
if(HOST){
  HOST.addEventListener("message",ev=>{
    const m=ev.data; if(!m||!m.host) return;
    switch(m.host){
      case "batch": for(const s of m.items){try{handle(JSON.parse(s))}catch(e){}} break;
      case "status": setLink(m.value); break;
      case "locked": setLocked(!!m.value); break;
      case "replay": startReplay(parseLog(m.text||""),m.name||"log","replay"); break;
      case "menu":
        if(m.action==="demo") $("mDemo").click();
        else if(m.action==="replay") openLog();
        else if(m.action==="live") connectLive();
        break;
    }
  });
}

/* ================= Início ================= */
window.__rm={S,LE,handle};
fillHist(); showTab(S.tab);
if(HOST){S.mode="wait";post({cmd:"ready",url:WS_URL})}
else if(BROWSER_LIVE) connectLive();
else { setSpeed(4); startReplay(demoLog(),"Demonstração","demo") }
render();
})();
